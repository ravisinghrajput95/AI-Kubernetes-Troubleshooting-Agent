server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The console is never meant to be framed; this is the modern form of
    # X-Frame-Options and costs nothing.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Content-hashed, so a deploy never serves a stale one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes (/investigations/<id>, /clusters/<name>) are the
    # single-page app's to resolve.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
