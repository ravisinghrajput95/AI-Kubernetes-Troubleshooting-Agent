# The cluster `scripts/integration_verify.sh` stands the platform up on.
#
# Single node, because nothing asserted here is about scheduling across nodes —
# the multi-worker properties are exercised by replicaCount, not by node count,
# and a second node doubles the slowest step in CI for nothing.
#
# The port mappings and the `ingress-ready` label are what make the ingress
# assertions possible: ingress-nginx's kind manifest schedules the controller
# onto a node carrying that label and binds host ports, so the Ingress is
# reachable at http://localhost from outside the cluster. Without them the
# Ingress object exists, is correct, and serves nobody — which is exactly the
# state §21 recorded as "created and correct, but no controller was installed".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
