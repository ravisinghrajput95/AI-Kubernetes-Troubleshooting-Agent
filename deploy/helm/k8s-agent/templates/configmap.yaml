apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-agent.fullname" . }}
  labels: {{- include "k8s-agent.labels" . | nindent 4 }}
data:
  AUTH_MODE: {{ .Values.auth.mode | quote }}
  ALLOW_INSECURE_NO_AUTH: {{ .Values.auth.allowInsecureNoAuth | quote }}
  {{- if eq .Values.auth.mode "oidc" }}
  OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  OIDC_AUDIENCE: {{ .Values.auth.oidc.audience | quote }}
  OIDC_JWKS_URL: {{ .Values.auth.oidc.jwksUrl | quote }}
  OIDC_USERNAME_CLAIM: {{ .Values.auth.oidc.usernameClaim | quote }}
  OIDC_GROUPS_CLAIM: {{ .Values.auth.oidc.groupsClaim | quote }}
  OIDC_TENANT_CLAIM: {{ .Values.auth.oidc.tenantClaim | quote }}
  OIDC_ROLE_MAPPINGS: {{ .Values.auth.oidc.roleMappings | quote }}
  {{- end }}
  RBAC_DEFAULT_ROLE: {{ .Values.rbac.defaultRole | quote }}
  IMPERSONATE_USERS: {{ .Values.impersonateUsers | quote }}
  TENANCY_MODE: {{ .Values.tenancy.mode | quote }}
  OPENAI_MODEL: {{ .Values.openai.model | quote }}
  METRICS_ENABLED: {{ .Values.metrics.enabled | quote }}
  PROMETHEUS_URL: {{ .Values.prometheusUrl | quote }}
  LOKI_URL: {{ .Values.lokiUrl | quote }}
  PROMETHEUS_TENANT_ID: {{ .Values.prometheusTenantId | quote }}
  LOKI_TENANT_ID: {{ .Values.lokiTenantId | quote }}
  JOB_MAX_CONCURRENT: {{ .Values.config.jobMaxConcurrent | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
  RATE_LIMIT_TENANT_PER_MINUTE: {{ .Values.config.rateLimitTenantPerMinute | quote }}
  REPORT_RETENTION_DAYS: {{ .Values.config.reportRetentionDays | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- with .Values.config.corsOrigins }}
  CORS_ORIGINS: {{ join "," . | quote }}
  {{- end }}
  {{- with .Values.config.notifyDestinations }}
  NOTIFY_DESTINATIONS: {{ . | quote }}
  {{- end }}
  {{- if .Values.agentGateway.enabled }}
  AGENT_GATEWAY_PORT: {{ .Values.agentGateway.port | quote }}
  {{- $svc := printf "%s-gateway" (include "k8s-agent.fullname" .) }}
  {{- $ns := .Release.Namespace }}
  {{- $names := list $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
  {{- $names = concat $names .Values.agentGateway.dnsNames }}
  AGENT_GATEWAY_DNS_NAMES: {{ join "," $names | quote }}
  {{/*
  What `POST /agents/enrolment` tells an agent to dial, and what the manifest it
  generates puts on the command line.

  Unset, `settings.agent_gateway_advertise` is empty and the endpoint renders as
  the literal `<platform-host>:9443`. So a chart-deployed onboarding flow — the
  console's /connect page included — hands the operator a manifest containing a
  placeholder, and the agent it deploys cannot resolve anything. Third instance
  of this exact shape in this chart, after the probe paths and the gateway's own
  DNS names: the knob exists in the platform and nothing turns it.

  Defaults to this release's gateway Service, which is the address an in-cluster
  agent should use. `agentGateway.advertise` overrides it for agents dialling
  from outside, and should name something in `agentGateway.dnsNames`.
  */}}
  AGENT_GATEWAY_ADVERTISE: {{ .Values.agentGateway.advertise | default (printf "%s.%s.svc.cluster.local:%d" $svc $ns (int .Values.agentGateway.port)) | quote }}
  {{- with .Values.agentGateway.image }}
  AGENT_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.agentGateway.ipAddresses }}
  AGENT_GATEWAY_IP_ADDRESSES: {{ join "," . | quote }}
  {{- end }}
  {{- if .Values.agentGateway.caSecret.name }}
  AGENT_CA_CERT_FILE: /etc/agent-ca/{{ .Values.agentGateway.caSecret.certKey }}
  AGENT_CA_KEY_FILE: /etc/agent-ca/{{ .Values.agentGateway.caSecret.keyKey }}
  {{- end }}
  {{- end }}
