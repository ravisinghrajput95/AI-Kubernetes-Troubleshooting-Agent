{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{/*
/metrics is on the unauthenticated health router, which is safe precisely
because no series carries a cluster, tenant, namespace, user or investigation
id. A scraper is infrastructure and carries no tenant; labelling by cluster
would publish the customer list to anyone who can reach the port.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "k8s-agent.fullname" . }}
  labels:
    {{- include "k8s-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "k8s-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
