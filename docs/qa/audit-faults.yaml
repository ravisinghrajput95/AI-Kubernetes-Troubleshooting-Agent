# The fault-injection fixture from the 2026-08-03 acceptance audit.
#
# Backlog item 50. Nine deliberate faults plus one healthy control, in one
# namespace. This is the manifest that found BUG-01 (ImagePullBackOff read as
# Pending), BUG-02 (a missing ConfigMap diagnosed as a missing image) and
# BUG-03 (a Running-but-never-Ready pod invisible to `problematic_pods`), all
# while the test suite, the linter and the eval corpus were green.
#
#   kind create cluster --name qa
#   kubectl apply -f docs/qa/audit-faults.yaml
#   # allow ~3 minutes for restart counts and events to accumulate
#   kubectl get pods -n payments
#
# Then investigate the `payments` namespace and compare against the expectations
# table in `docs/QA_AUDIT_2026-08-03.md` §2.
#
# **The healthy control is not optional.** `healthy-api` is what distinguishes
# "detected every fault" from "flagged everything"; a run that reports it as a
# problem has a false-positive rate of one in ten and no amount of recall makes
# up for that.
#
# Two things differ deliberately from what the audit ran:
#
#   * **The OOM workload actually OOMs now.** The original used a shell
#     allocation trick that died in containerd exec before allocating anything,
#     so `pod.oom_killed` went unverified and the audit said so rather than
#     claiming a pass. This allocates from Python against a 96Mi limit and is
#     confirmed to produce a genuine `OOMKilled` with exit code 137.
#   * **Images are pinned by tag.** `:latest` made two audit runs disagree about
#     what `ledger` was even trying to pull.
#
# For the Prometheus/Loki-specific faults, see `docs/qa/observability-faults.yaml` —
# those exercise query shapes rather than detection rules and are a separate set.

apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    purpose: qa-fault-injection
---
# ---------------------------------------------------------------- CrashLoopBackOff
# Exits non-zero after printing an application-level cause. The log line is the
# point: `logs.error_pattern` should quote it verbatim rather than counting it,
# and it is what made this the selected root cause in the audit run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "starting checkout service"
              echo "FATAL: config key DB_HOST is not set"
              exit 1
          resources:
            limits: {cpu: 100m, memory: 64Mi}
---
# --------------------------------------------------------------- FailedScheduling
# Requests more CPU and memory than any node can offer, so it never schedules.
# Expect `scheduling.insufficient_resources` and `event.scheduling_failure`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-trainer
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: batch-trainer}
  template:
    metadata:
      labels: {app: batch-trainer}
    spec:
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: {cpu: "64", memory: 512Gi}
---
# ------------------------------------------------------------------ PVC unbindable
# A claim naming a StorageClass that does not exist. The pod stays Pending on
# the claim, which is the three-section path `graph.pod_blocked_by_storage`
# exists to walk: pod -> claim -> class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive-data
  namespace: payments
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nonexistent-fast-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archiver
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: archiver}
  template:
    metadata:
      labels: {app: archiver}
    spec:
      containers:
        - name: archiver
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: archive-data
---
# ------------------------------------------------------------ Service, no endpoints
# The selector matches nothing — `app: checkout-api` exists on no pod. This is
# the case that must be distinguished from "selector matches pods, but they are
# unready"; both produce zero endpoints and they need different fixes.
apiVersion: v1
kind: Service
metadata:
  name: checkout-svc
  namespace: payments
spec:
  selector:
    app: checkout-api
  ports:
    - {port: 80, targetPort: 8080}
---
# ------------------------------------------------------------- Readiness failing
# Runs happily and never becomes Ready: the probe hits a port nothing listens
# on. BUG-03 was that this pod was absent from `problematic_pods` entirely,
# because the container is neither waiting nor terminated — it is Running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          readinessProbe:
            tcpSocket: {port: 9999}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 1
          resources:
            limits: {cpu: 100m, memory: 64Mi}
---
# --------------------------------------------------------------- Missing ConfigMap
# `envFrom` a ConfigMap that does not exist -> CreateContainerConfigError.
# BUG-02: this was reported as "Image or tag does not exist in the registry",
# because an image rule fired on any `Failed` event containing "not found".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: notifier}
  template:
    metadata:
      labels: {app: notifier}
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          envFrom:
            - configMapRef:
                name: notifier-config-does-not-exist
          resources:
            limits: {cpu: 100m, memory: 64Mi}
---
# ------------------------------------------------------------------ ImagePullBackOff
# The headline defect. The pod *phase* is Pending while the container's waiting
# reason is ImagePullBackOff; the code read the phase and reported "Pending",
# so one of the two most common Kubernetes failures produced no signal, no
# hypothesis and no remediation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      containers:
        - name: ledger
          # Docker Hub, and a tag that does not exist, so the registry
          # answers an unambiguous manifest-not-found.
          #
          # `ghcr.io/example/ledger:...` was the first choice and produced a
          # *different* fault: ghcr returns 403 Forbidden for a repository that
          # does not exist, because it cannot distinguish "no such repo" from
          # "you may not see it" without leaking which private repos exist. The
          # platform then correctly reported `image.pull_unauthorized` — a right
          # answer to a question this fixture did not mean to ask.
          image: docker.io/library/busybox:v0.0.0-does-not-exist
          resources:
            limits: {cpu: 100m, memory: 64Mi}
---
# ------------------------------------------------------------------------ OOMKilled
# Allocates 6 MiB per second against a 96Mi limit, so the kernel kills it about
# every ninety seconds. Verified: `lastState.terminated.reason == OOMKilled`,
# exit code 137, restart count climbing.
#
# The audit's original attempt used a shell trick that died before allocating,
# leaving `pod.oom_killed` unverified against a real cluster. If you change this
# workload, confirm the reason and exit code rather than assuming the limit did
# its job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scorer
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: fraud-scorer}
  template:
    metadata:
      labels: {app: fraud-scorer}
    spec:
      containers:
        - name: scorer
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time
              buf = []
              while True:
                  buf.append(bytearray(6 * 1024 * 1024))
                  print(f"allocated {len(buf) * 6}MiB", flush=True)
                  time.sleep(1.0)
          resources:
            limits: {memory: 96Mi, cpu: 200m}
            requests: {memory: 96Mi, cpu: 200m}
---
# -------------------------------------------------------------------- Healthy control
# Must never be flagged. This is the workload that turns "found nine faults"
# into a meaningful result rather than a tautology.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: {app: healthy-api}
  template:
    metadata:
      labels: {app: healthy-api}
    spec:
      containers:
        - name: api
          image: registry.k8s.io/pause:3.9
          resources:
            limits: {cpu: 50m, memory: 32Mi}
            requests: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-api
  namespace: payments
spec:
  selector:
    app: healthy-api
  ports:
    - {port: 80, targetPort: 80}
