# Publishes the cluster agent image.
#
# The console's onboarding page generates a manifest that references this
# image by name. Until it existed anywhere, that manifest was a set of
# instructions nobody outside this repository could follow — the one step of
# "connect a cluster" that could not be completed.
#
# Published to GHCR because the repository is already there: no second registry
# to authenticate against, and the package inherits the repository's
# visibility, so a public repo yields a pullable image with no extra setup.

name: Agent image

on:
  push:
    branches: [main]
    # Only when something that ends up inside the image changes. A console
    # tweak should not mint a new agent release for a thousand clusters to
    # eventually pull.
    paths:
      - "agent/**"
      - "proto/**"
      - ".github/workflows/agent-image.yml"
  # Releases are what customers pin to; `main` builds are `edge`. A separate
  # trigger rather than a tag filter on `push`, because `paths` would apply to
  # the tag push too and skip the release build whenever the tag happened to
  # contain no agent changes.
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/k8s-ops-agent

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the automatic token.
      packages: write
      # Lets the build attach provenance attestations to the published image.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      # The image ships into customer clusters, so it is built only from a
      # tree that already passed the agent's own checks.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum

      - name: Vet and test
        working-directory: agent
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      # arm64 as well as amd64: Graviton and Ampere node pools are ordinary
      # now, and an agent that cannot run on them cannot connect that cluster.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event_name == 'release' && github.ref_name || format('edge-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A customer installing this into a production cluster can verify where
      # it was built from, which is the least a supply chain should offer.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
