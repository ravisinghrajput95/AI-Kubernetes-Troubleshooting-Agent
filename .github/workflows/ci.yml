name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the Dockerfile and the pinned dependency set.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      # `scripts/` is included, and was not before. All nine already conformed
      # to backend/ruff.toml by convention — but a convention nothing checks is
      # a convention that is already drifting, and the two files added this
      # milestone both landed unformatted.
      - name: Lint
        run: |
          ruff check .
          ruff check --config ruff.toml ../scripts

      - name: Format check
        run: |
          ruff format --check .
          ruff format --check --config ruff.toml ../scripts

      # Generated protobuf bindings are committed, so a .proto edit that was not
      # regenerated would otherwise pass every other check and only surface once
      # an agent could not decode a message.
      - name: Protobuf bindings are current
        run: python ../scripts/generate_proto.py --check

      - name: Tests
        run: python -m pytest -q

      # Printed even on success: the numbers are the point, not just the exit
      # code. A drop in reasoning accuracy is visible in the log.
      - name: Reasoning evaluation
        run: python -m evals

      # Re-runs the mutation tests that were done by hand for each invariant:
      # revert a defect that actually shipped, require the test written to
      # catch it to fail, restore. Seconds, because it is six targeted
      # mutations rather than a fuzzer.
      #
      # It runs on 3.12 only. The mutations are about our own logic, not about
      # interpreter behaviour, so a second run on 3.13 would cost time to
      # re-derive the same answer.
      - name: Mutation tests still catch their defects
        if: matrix.python-version == '3.12'
        run: python ../scripts/mutation_check.py

  # The default suite is hermetic and needs no database, which is what keeps
  # `python -m pytest` usable on a laptop. That would leave the distributed job
  # store verified only by whoever remembered to opt in, so it gets its own job
  # with real Postgres and Redis.
  backend-integration:
    name: Backend (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k8sagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Integration tests
        env:
          K8S_AGENT_INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/k8sagent_test
          REDIS_URL: redis://localhost:6379/1
        run: python -m pytest -q

  # Stand the platform up on kind and assert it works against the real things
  # it talks to. `scripts/integration_verify.sh` and `scripts/verify_deployment.py`.
  #
  # **Required, not opt-in, and that is a deliberate cost.** Every significant
  # defect in this project's last seven tiers was found by a human standing
  # something up, never by a test and never by CI. The most recent shipped to
  # main with 1,338 tests green: /metrics advertised OpenMetrics and emitted
  # Prometheus text format, so a real Prometheus rejected every scrape and all
  # 17 alert rules evaluated against nothing. A job allowed to fail is the same
  # as no job — it becomes noise inside a week and then nobody reads it — and a
  # class of defect that has reached main four times is not one to detect
  # optionally. The price is ~12 minutes of wall clock, in parallel with jobs
  # that already take five.
  #
  # What belongs here rather than in `backend-integration`: that job runs *our
  # code* against real Postgres and Redis in one process, and its assertions are
  # about our own contracts. Everything here needs a *second product* to agree
  # with us — Prometheus's parser, nginx's buffering, the kubelet's probe path,
  # the operator's label selector — and can only be observed from outside the
  # pod.
  integration-verify:
    name: Integration (kind + Helm + Prometheus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The action, only to put the kind binary on PATH — the script owns
      # cluster creation, so that the thing CI runs is the thing a laptop runs.
      #
      # Its post-step logs a harmless `No such container: kind-registry` on the
      # way out, and hand-rolling the install to be rid of that line broke the
      # job outright: /usr/local/bin needs root on a runner, so `chmod` failed
      # with "Operation not permitted". Cosmetic noise in a passing log is not
      # worth replacing a working, maintained step over.
      - uses: helm/kind-action@v1
        with:
          version: v0.24.0
          install_only: true

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.1

      # Go and the backend dependencies are for the differential agent suite the
      # script runs at the end: a real Go binary, built for this host, enrolling
      # over mTLS against a gateway this job starts, answering reads from the
      # kind cluster — and its evidence compared against the same reads made
      # through kubectl. That suite is M4's exit criterion and until now ran
      # nowhere, because nothing set `K8S_AGENT_CLUSTER_INTEGRATION`.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No `if: failure()` dump step. The script installs its own trap, which
      # dumps pods, the Deployment and the platform's logs *before* deleting
      # the cluster — a step here runs after that teardown and can only report
      # that the context no longer exists, which is what the first CI run did.
      - name: Stand the platform up and verify it
        run: scripts/integration_verify.sh

  agent:
    name: Cluster agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm test

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history; a shallow clone makes it exit non-zero
          # with "stderr is not empty" even when it finds nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict

      # Advisory only: GitHub push protection is the authoritative gate and
      # blocks at the push itself. This surfaces findings earlier without
      # duplicating that gate.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t ai-k8s-agent-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t ai-k8s-agent-frontend:ci ./frontend
