name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the Dockerfile and the pinned dependency set.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Generated protobuf bindings are committed, so a .proto edit that was not
      # regenerated would otherwise pass every other check and only surface once
      # an agent could not decode a message.
      - name: Protobuf bindings are current
        run: python ../scripts/generate_proto.py --check

      - name: Tests
        run: python -m pytest -q

      # Printed even on success: the numbers are the point, not just the exit
      # code. A drop in reasoning accuracy is visible in the log.
      - name: Reasoning evaluation
        run: python -m evals

  # The default suite is hermetic and needs no database, which is what keeps
  # `python -m pytest` usable on a laptop. That would leave the distributed job
  # store verified only by whoever remembered to opt in, so it gets its own job
  # with real Postgres and Redis.
  backend-integration:
    name: Backend (Postgres + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k8sagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Integration tests
        env:
          K8S_AGENT_INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/k8sagent_test
          REDIS_URL: redis://localhost:6379/1
        run: python -m pytest -q

  agent:
    name: Cluster agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: agent/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...


  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm test

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history; a shallow clone makes it exit non-zero
          # with "stderr is not empty" even when it finds nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict

      # Advisory only: GitHub push protection is the authoritative gate and
      # blocks at the push itself. This surfaces findings earlier without
      # duplicating that gate.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t ai-k8s-agent-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t ai-k8s-agent-frontend:ci ./frontend
