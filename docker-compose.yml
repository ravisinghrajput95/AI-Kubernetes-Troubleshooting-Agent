# Two topologies in one file.
#
#   docker compose up --build
#     Backend, console, Postgres and Redis. State is durable, and the console
#     reaches the backend on a fixed http://localhost:8000.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#       up --scale backend=3
#     The multi-worker demonstration. It needs the override because three
#     replicas cannot share one host port — see that file for why the console's
#     address stops being fixed once you scale.
#
#   Local development needs none of this. `uvicorn app.main:app --reload` with
#   neither DATABASE_URL nor REDIS_URL set keeps jobs in process and reports on
#   local disk, and stays the getting-started path.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-kubernetes-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8sagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend migrates at startup, so it must not start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ai-kubernetes-agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      # A single fixed port, because the console's bundle hardcodes
      # http://localhost:8000 and this must agree with it on every run.
      #
      # This was a range (`8000-8009:8000`) until it was measured. Docker's
      # port allocator does **not** hand a range's low end to the first
      # replica: it keeps a cursor per range and walks forward on each
      # allocation, wrapping at the top. So the *first* `up` on a given daemon
      # published 8000 and the console worked — and every recreate after that
      # drifted, 8001, 8002, ..., 8009, back to 8000. Measured over eleven
      # consecutive up/down cycles, and confirmed against a never-used range,
      # which starts at its low end and then walks identically.
      #
      # That is the worst available shape for a getting-started path: it works
      # the first time you try it, which is when you write it down, and then
      # silently stops, returning about one run in ten. Scaling moves to an
      # override file rather than costing every single-replica user a console
      # that cannot reach its backend.
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/k8sagent
      REDIS_URL: redis://redis:6379/0
      # This file is a local demonstration, not a deployment. The service holds
      # a kubeconfig, so running with authentication off has to be acknowledged
      # explicitly — and this file deliberately does **not** acknowledge it for
      # you. Pre-setting it here was the "careless deployment" F13 warns about,
      # shipped in the repository: a `docker compose up` that publishes a port
      # and authenticates nobody, with the acknowledgement supplied by us.
      #
      # Neither does it supply a *mode*. It passed `${AUTH_MODE:-disabled}`
      # until v0.2.0, which made the line below teach the wrong lesson: the
      # first of these used to be enough on its own, so the open deployment was
      # one variable away and nobody had said the word `disabled`.
      #
      # So `docker compose up` refuses to start until you choose, in full:
      #
      #   AUTH_MODE=disabled ALLOW_INSECURE_NO_AUTH=true docker compose up
      #   AUTH_MODE=token API_TOKENS=tok:you@example.com docker compose up
      #
      # The refusal is at startup and names every way forward, so the fix is
      # one line rather than a search. Read SECURITY.md before exposing this
      # port.
      AUTH_MODE: ${AUTH_MODE:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      API_TOKENS: ${API_TOKENS:-}
      KUBECONFIG: /home/app/.kube/config
    volumes:
      # Read-only. Without cluster credentials the backend still starts and
      # reports every collector as unavailable, rather than failing to boot.
      - ${KUBECONFIG_FILE:-~/.kube/config}:/home/app/.kube/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ai-kubernetes-agent-frontend
    ports:
      - "3000:3000"
    environment:
      # Fixed, and it agrees with the backend's fixed 8000 above. Overridable
      # because `docker-compose.scale.yml` publishes a range, where no replica
      # reliably lands on 8000.
      react_PUBLIC_API_BASE_URL: ${react_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres-data:
