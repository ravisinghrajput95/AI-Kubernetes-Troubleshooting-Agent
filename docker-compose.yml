services:
  backend:
    build:
      context: ./backend
    container_name: ai-kubernetes-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

  frontend:
    build:
      context: ./frontend
    container_name: ai-kubernetes-agent-frontend
    ports:
      - "3000:3000"
    environment:
      react_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
