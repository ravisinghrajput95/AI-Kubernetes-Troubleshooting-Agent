# Two topologies in one file.
#
#   docker compose up --build
#     Backend, console, Postgres and Redis. State is durable, and the backend
#     can be scaled: `docker compose up --scale backend=3`.
#
#   Local development needs none of this. `uvicorn app.main:app --reload` with
#   neither DATABASE_URL nor REDIS_URL set keeps jobs in process and reports on
#   local disk, and stays the getting-started path.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-kubernetes-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: k8sagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend migrates at startup, so it must not start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ai-kubernetes-agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      # A range, not a single port, so `--scale backend=3` can bind them all.
      # The first replica gets 8000, which is what the console points at.
      - "8000-8009:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/k8sagent
      REDIS_URL: redis://redis:6379/0
      # This file is a local demonstration, not a deployment. The service holds
      # a kubeconfig, so running with authentication off has to be acknowledged
      # explicitly — and this file deliberately does **not** acknowledge it for
      # you. Pre-setting it here was the "careless deployment" F13 warns about,
      # shipped in the repository: a `docker compose up` that publishes a port
      # and authenticates nobody, with the acknowledgement supplied by us.
      #
      # Neither does it supply a *mode*. It passed `${AUTH_MODE:-disabled}`
      # until v0.2.0, which made the line below teach the wrong lesson: the
      # first of these used to be enough on its own, so the open deployment was
      # one variable away and nobody had said the word `disabled`.
      #
      # So `docker compose up` refuses to start until you choose, in full:
      #
      #   AUTH_MODE=disabled ALLOW_INSECURE_NO_AUTH=true docker compose up
      #   AUTH_MODE=token API_TOKENS=tok:you@example.com docker compose up
      #
      # The refusal is at startup and names every way forward, so the fix is
      # one line rather than a search. Read SECURITY.md before exposing this
      # port.
      AUTH_MODE: ${AUTH_MODE:-}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      API_TOKENS: ${API_TOKENS:-}
      KUBECONFIG: /home/app/.kube/config
    volumes:
      # Read-only. Without cluster credentials the backend still starts and
      # reports every collector as unavailable, rather than failing to boot.
      - ${KUBECONFIG_FILE:-~/.kube/config}:/home/app/.kube/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ai-kubernetes-agent-frontend
    ports:
      - "3000:3000"
    environment:
      react_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres-data:
